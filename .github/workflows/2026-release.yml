#############################################################################
# BUILD, PUSH, AND DEPLOY
#############################################################################

name: 2026 - 🌐🐦⚡️ Release

on:
  pull_request:
    branches:
      - 2026
  workflow_dispatch:
# concurrency: ${{ github.workflow }}-refs/heads/2026
env:
  GITHUB_TOKEN: ${{ github.token }}
  NPM_TOKEN: ${{ secrets.NPM_PIGEON_WEB_ACCESS_TOKEN }}
  ID: 2026
permissions:
  contents: write # to create release (changesets/action)
  pull-requests: write # to create pull request (changesets/action)
  issues: write # to post issue comments (changesets/action
  id-token: write # to use OpenID Connect token for provenance (changesets/action)
  actions: write # to create workflow dispatches 

# #############################################################################
# JOBS
# #############################################################################

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: ⬇️🛎 Checkout
        uses: actions/checkout@v6
      - name: ⬇️🏃‍♂️ Set up
        uses: ./.github/actions/setup-2026/
        with: 
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      # Playwright binaries
      - name: Get installed Playwright version
        id: playwright_data
        run: echo "version=$( node -e "console.log(require('./package.json').devDependencies['@playwright/test'])" )" >> $GITHUB_OUTPUT
      - name: Cache playwright binaries
        uses: actions/cache@v5
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_data.outputs.version }}
      - name: ⬇️🌐 Install Playwright Browsers
        run: pnpx playwright install --with-deps
        if: steps.playwright_cache.outputs.cache-hit != 'true'

      - name: 🏗 Build packages
        run: pnpm build
      - name: ✅ Run [e2e & unit] tests
        run: pnpm test

      #########################################################################
      # EXIT IF IS PULL REQUEST
      #########################################################################

      - name: 🚪 Exit here if is pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request detected, exiting..."
          exit 0
        env:
          GITHUB_TOKEN: ${{env.GITHUB_TOKEN }}

     #########################################################################
      #########################################################################
      # UPDATE VERSIONS
      #########################################################################
      #########################################################################

      - name: 📣 Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages 🦋"
          version: pnpm dovenv pkg version --silent
          publish: pnpm dovenv pkg publish --silent
          commit: "chore(release): version packages 🦋 [skip ci]"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_PIGEON_WEB_ACCESS_TOKEN }}

      - name: Get updated versions if exists
        id: updated
        run: |
          core_version=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "@pigeonposse/web-${{env.ID}}") | .version')
          core_version_major=${core_version%%.*}
          echo Set changesets outputs
          echo '${{ toJSON(steps.changesets.outputs) }}'
          echo Set updated versions
          echo "core_version=$core_version" >> $GITHUB_OUTPUT
          echo "core_version_major=$core_version_major" >> $GITHUB_OUTPUT

      - name: 🐳🐙😺➡️ Call to workflow for deploy Docker
        if: steps.updated.outputs.core_version != ''
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{env.ID}}-docker.yml
        continue-on-error: true

      - name: 📚🐙😺➡️ Call to workflow for deploy Documentation
        if: steps.updated.outputs.core_version != ''
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{env.ID}}-deploy.yml
        continue-on-error: true

###############################################################################
