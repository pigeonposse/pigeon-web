name: 2026 - 🌐🐦⚡️ Update Web API

on:
  schedule:
    - cron: '0 */12 * * *' # run every 12 hours
  workflow_dispatch:
# concurrency: ${{ github.workflow }}-refs/heads/2026
env:
  GITHUB_TOKEN: ${{ github.token }}
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️🛎 Checkout
        uses: actions/checkout@v6
      - name: ⬇️🏃‍♂️ Set up
        uses: ./.github/actions/setup-2026/
        with: 
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: 🏗 Build packages
        run: pnpm build
      - name: update api
        run: |
         GH_TOKEN="${{ secrets.GH_API_TOKEN }}" CF_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" CF_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" pnpm keys

